<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island Look-Test 3D v2</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,sans-serif}
canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
#ui{position:absolute;top:10px;left:10px;display:flex;gap:8px;z-index:2;align-items:center}
#ui b{color:#fff;font-size:14px;background:#0b1020cc;padding:7px 10px;border-radius:8px}
button{font:600 13px system-ui;padding:7px 12px;border-radius:8px;border:2px solid #2a3558;background:#141c36;color:#e8ecff;cursor:pointer}
button.on{background:#3b4f9a;border-color:#6d82d8}
#hint{position:absolute;bottom:10px;left:10px;color:#c3cbea;font:12px system-ui;z-index:2;background:#0b1020cc;padding:6px 10px;border-radius:6px;max-width:calc(100% - 40px)}
</style></head><body>
<div id="ui"><b>3D-pixel v2</b><button id="storm">⛈ Storm (S)</button><button id="night">🌙 Night (N)</button><button id="rot">⟳ Rotate (Q/E)</button><button id="flt" class="on">✨ Pixel filter (F)</button></div>
<canvas id="c"></canvas>
<div id="hint">Click to walk the leader (blue ring). F toggles the pixel filter so you can see before/after. Arrow keys pan, Q/E rotate, scroll to zoom. Storm rips the hut apart and survivors carry the pieces back.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const W=400,H=225;
const cv=document.getElementById('c');let S=2;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);S=s>=1?Math.floor(s):s;cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.style.left=((innerWidth-W*S)/2|0)+'px';cv.style.top=((innerHeight-H*S)/2|0)+'px';}
addEventListener('resize',fit);fit();

// ---------- noise ----------
function hash(x,y,s=0){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){let t=0,a=.5,f=1;for(let i=0;i<4;i++){t+=a*vnoise(x*f,y*f,s+i*17);f*=2;a*=.5;}return t;}
const sst=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
const rnd=Math.random;

// ---------- terrain ----------
const WATER=.35,camp={x:3,z:2},SIZE=96,SEG=160;
const coastC=(x,z)=>(x+10)/50-(z-8)/45+(fbm(x/14+50,z/14+50,1)-.47)*.8;
const plat=(x,z)=>fbm(x/10+20,z/10+20,7)*.7+Math.exp(-((x-17)**2+(z+13)**2)/(2*12*12))*.82+Math.exp(-((x-30)**2+(z-14)**2)/(2*8*8))*.72;
function hgt(x,z){const c=coastC(x,z);if(c<0)return .55+c*9;
  let h=.55+Math.min(c,.2)*1.4+(fbm(x/6,z/6,5)-.5)*.3*sst(.05,.2,c);
  const p=plat(x,z),m=sst(.18,.3,c)*sst(13,17,Math.hypot(x-camp.x,z-camp.z));
  return h+m*(sst(.83,.87,p)*2.4+sst(1.1,1.14,p)*2.4);}

const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();const SKY=new THREE.Color('#1c5291');scene.background=SKY.clone();
let VIEW=30;const cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,300);
const camT=new THREE.Vector3(5,0,1);let yaw=.0,yawT=.0;const PITCH=.82;
function placeCam(){const a=VIEW*W/H/2;cam.left=-a;cam.right=a;cam.top=VIEW/2;cam.bottom=-VIEW/2;cam.updateProjectionMatrix();
  cam.position.set(camT.x+Math.sin(yaw)*Math.cos(PITCH)*100,camT.y+Math.sin(PITCH)*100,camT.z+Math.cos(yaw)*Math.cos(PITCH)*100);cam.lookAt(camT);cam.updateMatrixWorld();
  const e=cam.matrixWorld.elements,px=VIEW/H,rx=e[0],ry=e[1],rz=e[2],ux=e[4],uy=e[5],uz=e[6];const r=camT.x*rx+camT.y*ry+camT.z*rz,u=camT.x*ux+camT.y*uy+camT.z*uz;
  const dr=Math.round(r/px)*px-r,du=Math.round(u/px)*px-u;cam.position.x+=rx*dr+ux*du;cam.position.y+=ry*dr+uy*du;cam.position.z+=rz*dr+uz*du;cam.updateMatrixWorld();}

const hemi=new THREE.HemisphereLight(0xcfe4ff,0x4a6a3a,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,.9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:200});sun.shadow.bias=-.0015;scene.add(sun,sun.target);

// toon lighting: stepped shading like hand-drawn pixel art
const gradTex=new THREE.DataTexture(new Uint8Array([70,140,200,255]),4,1,THREE.LuminanceFormat);gradTex.minFilter=gradTex.magFilter=THREE.NearestFilter;gradTex.generateMipmaps=false;gradTex.needsUpdate=true;
const toon=o=>new THREE.MeshToonMaterial(Object.assign({gradientMap:gradTex},o));
const hx3=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],mulc=(a,f)=>[a[0]*f,a[1]*f,a[2]*f];
const TP={u0:hx3('#d8c48e'),u1:hx3('#9cb89a'),u2:hx3('#4f8aa0'),u3:hx3('#2a5f86'),u4:hx3('#1c4672'),foam:hx3('#f4fbf6'),
  s0:hx3('#efdca6'),s1:hx3('#e0c78e'),sw:hx3('#cfb27c'),shell:hx3('#fbf6e8'),
  g0:hx3('#2e6b31'),g1:hx3('#3c8838'),g2:hx3('#4c9b43'),g3:hx3('#5eae4e'),g4:hx3('#7cc35d'),
  dirt:hx3('#a48858'),dirt2:hx3('#8c724a'),r:[hx3('#a08e70'),hx3('#887760'),hx3('#6f604d')],crack:hx3('#3a3129'),lip:hx3('#2c5f2b'),
  tuft:hx3('#2f7a32'),tip:hx3('#6fbf55'),fl:[hx3('#f4e06b'),hx3('#f08aa0'),hx3('#ffffff'),hx3('#b48cf0')],pb:hx3('#9a9a94')};
const TN=768,TS=SIZE/TN,HG=new Float32Array(TN*TN),CG=new Float32Array(TN*TN);const t2w=i=>-SIZE/2+(i+.5)*TS;
for(let j=0;j<TN;j++){const z=t2w(j);for(let i=0;i<TN;i++){const x=t2w(i);HG[j*TN+i]=hgt(x,z);CG[j*TN+i]=coastC(x,z);}}
const Hg=(i,j)=>HG[Math.max(0,Math.min(TN-1,j))*TN+Math.max(0,Math.min(TN-1,i))];
const groundTex=(function(){const c=document.createElement('canvas');c.width=c.height=TN;const g=c.getContext('2d'),img=g.createImageData(TN,TN),D=img.data;
  const put=(i,j,col)=>{if(i<0||j<0||i>=TN||j>=TN)return;const k=(j*TN+i)*4;D[k]=col[0];D[k+1]=col[1];D[k+2]=col[2];D[k+3]=255;};
  const kind=new Uint8Array(TN*TN);
  for(let j=0;j<TN;j++){const z=t2w(j);for(let i=0;i<TN;i++){const x=t2w(i),k=j*TN+i,h=HG[k],cc=CG[k],r=hash(i,j,3);
    const sl=Math.max(Math.abs(Hg(i+1,j)-Hg(i-1,j)),Math.abs(Hg(i,j+1)-Hg(i,j-1)))/(2*TS);let col;
    if(h<WATER-.02){const d=(WATER-h)+(r-.5)*.07;col=d<.12?TP.u0:d<.35?TP.u1:d<.75?TP.u2:d<1.2?TP.u3:TP.u4;}
    else if(h<WATER+.06)col=r<.8?TP.foam:TP.s0;
    else if(sl>1.05){const b=Math.floor(h*4.5+vnoise(x*1.5,z*1.5,12)*.6)%3;col=TP.r[b];if(hash(i>>1,Math.floor(h*9),10)>.88)col=TP.crack;if(r<.08)col=mulc(col,.88);kind[k]=2;}
    else if(cc<.07&&h<1.05){col=cc<.02?TP.sw:r<.18?TP.s1:r>.992?TP.shell:TP.s0;kind[k]=3;}
    else{const f=fbm(x/4,z/4,3)+(r-.5)*.07;col=f>.6?TP.g3:f>.5?TP.g2:f>.4?TP.g1:TP.g0;if(r<.04)col=TP.g0;else if(r>.975)col=TP.g4;
      if(h>1.6)col=mixc(col,[150,190,90],h>3.6?.22:.12);
      const dc=Math.hypot(x-camp.x,z-camp.z);if(dc<11&&dc<7+fbm(x/1.5,z/1.5,9)*3.2-1.6)col=r<.55?TP.dirt:r<.8?TP.dirt2:col;else kind[k]=1;
      if(sl>.55)col=TP.lip;}
    let ao=0;for(let q=2;q<=8;q+=3){ao=Math.max(ao,Hg(i+q,j)-h,Hg(i-q,j)-h,Hg(i,j+q)-h,Hg(i,j-q)-h);}if(ao>.7&&sl<1.05)col=mulc(col,.72);
    put(i,j,col);}}
  for(let j=2;j<TN-2;j++)for(let i=2;i<TN-2;i++){const k=j*TN+i;if(kind[k]!==1||kind[k-TN]!==1)continue;const r=hash(i,j,21);
    if(r<.02){put(i-1,j,TP.tuft);put(i+1,j,TP.tuft);put(i,j,TP.tuft);put(i,j-1,TP.tuft);put(i,j-2,TP.tip);put(i-1,j-1,TP.tip);}
    else if(r<.024)put(i,j,TP.fl[(r*10000|0)%4]);
    else if(r<.0255){put(i,j,TP.pb);put(i+1,j,mulc(TP.pb,.6));put(i,j-1,mulc(TP.pb,1.15));}}
  g.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t;})();
(function buildTerrain(){const g=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);g.rotateX(-Math.PI/2);
  const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,hgt(p.getX(i),p.getZ(i)));g.computeVertexNormals();
  const m=new THREE.Mesh(g,toon({map:groundTex}));m.receiveShadow=true;m.castShadow=true;m.name='terrain';scene.add(m);})();
const terrain=scene.getObjectByName('terrain');
const waterGeo=new THREE.PlaneGeometry(SIZE*2.5,SIZE*2.5,90,90);waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.MeshPhongMaterial({color:0x2a8fc4,transparent:true,opacity:.74,flatShading:true,shininess:80,specular:0x9adfff});
const water=new THREE.Mesh(waterGeo,waterMat);water.position.y=WATER;scene.add(water);
const wBase=Float32Array.from(waterGeo.attributes.position.array);

// ---------- props ----------
const lam=c=>toon({color:c});
function pixTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){g.fillStyle=fn(x,y);g.fillRect(x,y,1,1);}
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t;}
const thatchTex=pixTex(12,12,(x,y)=>{const r=hash(x,y,90);if(y>=10)return (x+y)%2?'#7d5d24':'#9c7a34';if(y===0)return '#f0d68a';
  const strand=hash(x,0,91);if(strand<.25)return '#a07a32';if(strand>.85)return '#e8c870';return r<.15?'#b88f3e':'#d4ac58';});
const plankTex=pixTex(8,24,(x,y)=>{if(x===0)return '#4a3020';if(x===7)return '#6b4729';const r=hash(x,y,92);if((y===8||y===17)&&x>2&&x<5)return '#5a3a20';return r<.2?'#8a5c34':x===1?'#b07c4a':'#9a6a3e';});
const toonTex=(t,c)=>toon({map:t,color:c});
const M={trunk:lam(0x6b4a2b),leaf:[lam(0x3f8a3c),lam(0x4c9b43),lam(0x2f7034),lam(0x5aa84a)],leafL:lam(0x6dbb57),leafV:[0x3f8a3c,0x4c9b43,0x2f7a36,0x5aa84a].map(c=>toon({color:c,vertexColors:true})),leafLV:toon({color:0x6dbb57,vertexColors:true}),palm:lam(0x4c9b43),palmT:lam(0x8a6238),
  rock:lam(0x8d8a80),plank:[toonTex(plankTex,0xffffff),toonTex(plankTex,0xd8ccbc),toonTex(plankTex,0xf0e4d0)],post:lam(0x5a3a22),straw:[toonTex(thatchTex,0xe0d2bc),toonTex(thatchTex,0xc8b89e),toonTex(thatchTex,0xece0c8)],
  dark:lam(0x2a1c10),white:lam(0xe9edf2),red:lam(0xc8453a),win:lam(0x26334d),grey:lam(0x9aa0a8),stone:lam(0x7a7a74)};
function canopyGeo(seed){const g=new THREE.IcosahedronGeometry(1,2),p=g.attributes.position,n=g.attributes.normal,cols=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),k=1+(vnoise(x*2.2+9,y*2.2+z*1.7,seed)-.5)*.32;n.setXYZ(i,x,y,z);p.setXYZ(i,x*k,y*k*.9,z*k);}
  for(let t=0;t<p.count;t+=3){const v=hash(t,seed,7)<.3?.86:hash(t,seed,8)<.15?1.12:1;for(let q=0;q<3;q++){cols[(t+q)*3]=v;cols[(t+q)*3+1]=v;cols[(t+q)*3+2]=v;}}
  g.setAttribute('color',new THREE.BufferAttribute(cols,3));return g;}
const BLOBS=[0,1,2,3].map(i=>canopyGeo(200+i));
const G={trunk:new THREE.CylinderGeometry(.12,.2,1.3,5),ico:new THREE.IcosahedronGeometry(1,0),ico1:new THREE.IcosahedronGeometry(1,1),
  palmSeg:new THREE.CylinderGeometry(.11,.13,.7,5),frond:new THREE.BoxGeometry(.28,.05,1.5),rock:new THREE.DodecahedronGeometry(.4,0)};
function shadowAll(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});return o;}
const trees=[];
function addTree(x,z,s){const g=new THREE.Group();const t=new THREE.Mesh(G.trunk,M.trunk);t.scale.setScalar(s);t.position.y=.6*s;g.add(t);
  const top=new THREE.Group();top.position.y=1.1*s;g.add(top);const li=hash(x*7|0,z*7|0,1)*4|0;
  const a=new THREE.Mesh(BLOBS[li],M.leafV[li]);a.scale.set(1*s,.85*s,1*s);a.position.y=.45*s;top.add(a);
  const b=new THREE.Mesh(BLOBS[(li+1)%4],M.leafV[(li+1)%4]);b.scale.setScalar(.62*s);b.position.set(.42*s,.95*s,.15*s);top.add(b);
  const c=new THREE.Mesh(BLOBS[(li+2)%4],M.leafLV);c.scale.setScalar(.5*s);c.position.set(-.35*s,1.05*s,.3*s);top.add(c);
  g.position.set(x,hgt(x,z)-.05,z);g.rotation.y=rnd()*6;scene.add(shadowAll(g));trees.push({g,top,ph:rnd()*6});}
function addPalm(x,z){const g=new THREE.Group();let y=0,lx=0;const lean=(rnd()-.5)*.6;
  for(let i=0;i<5;i++){const s=new THREE.Mesh(G.palmSeg,M.palmT);s.position.set(lx,y+.35,0);s.rotation.z=lean*i*.25;g.add(s);y+=.66;lx-=Math.sin(lean*i*.25)*.66;}
  const top=new THREE.Group();top.position.set(lx,y,0);g.add(top);
  for(let k=0;k<7;k++){const f=new THREE.Group();f.rotation.y=k/7*Math.PI*2;const m=new THREE.Mesh(G.frond,k%2?M.palm:M.leaf[3]);m.position.z=.7;m.rotation.x=.45;f.add(m);top.add(f);}
  g.position.set(x,hgt(x,z)-.05,z);scene.add(shadowAll(g));trees.push({g,top,ph:rnd()*6,palm:true});}
const okFlat=(x,z,r=.8)=>{const h=hgt(x,z);return Math.abs(hgt(x+r,z)-h)<.25&&Math.abs(hgt(x-r,z)-h)<.25&&Math.abs(hgt(x,z+r)-h)<.25&&Math.abs(hgt(x,z-r)-h)<.25;};
for(let gz=-46;gz<46;gz+=2.1)for(let gx=-46;gx<46;gx+=2.1){const x=gx+hash(gx*10|0,gz*10|0,31)*1.6,z=gz+hash(gx*10|0,gz*10|0,32)*1.6;
  const c=coastC(x,z),h=hgt(x,z);if(h<WATER+.15)continue;const dc=Math.hypot(x-camp.x,z-camp.z);
  if(c<.08){if(c>.03&&hash(x*10|0,z*10|0,33)<.14&&dc>6)addPalm(x,z);continue;}
  if(dc<10.5||!okFlat(x,z))continue;
  if(fbm(x/7,z/7,3)>.42||(dc<15&&hash(x*10|0,z*10|0,37)<.1))addTree(x,z,.85+hash(x*10|0,z*10|0,38)*.55);
  else if(hash(x*10|0,z*10|0,41)<.06){const r=new THREE.Mesh(G.rock,M.rock);r.position.set(x,h,z);r.rotation.set(rnd(),rnd(),rnd());r.scale.set(1,.6,1);scene.add(shadowAll(r));}}

// wreck
(function(){let best=null;for(let a=0;a<200;a++){const x=-14+rnd()*16,z=-6+rnd()*14,c=coastC(x,z);if(c>.015&&c<.05&&hgt(x,z)>WATER+.05){best={x,z};break;}}
  if(!best)best={x:-6,z:4};const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,7,12,1,true),M.white);body.rotation.z=Math.PI/2;g.add(body);
  const inner=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,6.9,12,1,true),new THREE.MeshLambertMaterial({color:0x22252e,side:THREE.BackSide}));inner.rotation.z=Math.PI/2;g.add(inner);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(1.15,12,8,0,Math.PI*2,0,Math.PI/2),M.white);nose.rotation.z=-Math.PI/2;nose.position.x=3.5;nose.scale.y=1.6;g.add(nose);
  const stripe=new THREE.Mesh(new THREE.CylinderGeometry(1.17,1.17,7,12,1,true,Math.PI*.55,Math.PI*.25),M.red);stripe.rotation.z=Math.PI/2;g.add(stripe);
  for(let i=0;i<8;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.1),M.win);w.position.set(-2.6+i*.75,.35,1.12);g.add(w);}
  const wing=new THREE.Mesh(new THREE.BoxGeometry(4.5,.15,1.6),M.grey);wing.position.set(1,-.6,-2.6);wing.rotation.set(.1,.4,.08);g.add(wing);
  g.position.set(best.x,hgt(best.x,best.z)+.55,best.z);g.rotation.set(0,.5,.12);scene.add(shadowAll(g));})();

// ---------- hut ----------
const hut={g:new THREE.Group(),parts:[],lean:0};const hy=hgt(camp.x,camp.z);hut.g.position.set(camp.x,hy,camp.z);scene.add(hut.g);
(function(){const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0,parent=hut.g,detach=false)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);parent.add(m);m.castShadow=m.receiveShadow=true;
    if(detach)hut.parts.push({m,parent,pos:m.position.clone(),quat:m.quaternion.clone(),attached:true,claimed:false,v:new THREE.Vector3(),av:new THREE.Vector3(),rest:false,lost:false,carried:null,pop:0,kind:detach});return m;};
  add(new THREE.BoxGeometry(4.6,.25,3.6),M.post,0,.12,0);
  for(const [x,z] of [[-2.1,-1.6],[2.1,-1.6],[-2.1,1.6],[2.1,1.6]])add(new THREE.CylinderGeometry(.13,.13,2.1,5),M.post,x,1.05,z);
  const pg=new THREE.BoxGeometry(.5,1.85,.12);
  for(let i=0;i<9;i++){const x=-2+i*.5;add(pg,M.plank[i%3],x,1.05,-1.62,0,0,0,hut.g,'plank');if(i<3||i>5)add(pg,M.plank[(i+1)%3],x,1.05,1.62,0,0,0,hut.g,'plank');}
  add(new THREE.BoxGeometry(1.5,.4,.12),M.plank[0],0,1.8,1.62);
  for(let i=0;i<7;i++){const z=-1.5+i*.5;add(pg,M.plank[i%3],-2.12,1.05,z,0,Math.PI/2,0,hut.g,'plank');add(pg,M.plank[(i+2)%3],2.12,1.05,z,0,Math.PI/2,0,hut.g,'plank');}

    pt.v.x+=((storm*8+.5)-pt.v.x)*dt*(air>.3?1.1:.3);pt.v.z+=(storm*1.5-pt.v.z)*dt*(air>.3?1:.3);pt.v.y-=9*dt;if(air>.3&&pt.kind==='tile')pt.v.y+=storm*gust*7*dt*rnd();
    m.position.addScaledVector(pt.v,dt);m.rotation.x+=pt.av.x*dt;m.rotation.y+=pt.av.y*dt;m.rotation.z+=pt.av.z*dt;
    const gh=hgt(m.position.x,m.position.z);
    if(gh<WATER&&m.position.y<WATER+.05){pt.lost=true;m.visible=false;continue;}
    if(m.position.y<gh+.1){m.position.y=gh+.1;if(pt.v.length()<2.2){pt.rest=true;m.rotation.set(0,m.rotation.y,0);}else{pt.v.y=Math.abs(pt.v.y)*.3;pt.v.x*=.5;pt.v.z*=.5;pt.av.multiplyScalar(.6);}}
    if(Math.abs(m.position.x)>46||Math.abs(m.position.z)>46){pt.lost=true;m.visible=false;}}
  // particles
  for(let i=pool.length-1;i>=0;i--){const q=pool[i];q.l+=dt;if(q.kind==='leaf'){q.v.y=Math.sin(q.l*5)*1.5-.3;q.m.rotation.x+=dt*6;q.m.rotation.z+=dt*4;}
    if(q.kind==='smoke'){q.m.scale.setScalar(.2+q.l*.18);q.m.material.opacity=.55*(1-q.l/q.max);q.v.x+=(storm*4-q.v.x)*dt;}
    q.m.position.addScaledVector(q.v,dt);if(q.kind==='spark')q.v.y-=2*dt;if(q.l>q.max){scene.remove(q.m);if(q.kind!=='leaf')q.m.material.dispose();pool.splice(i,1);}}
  // rain
  const nr=Math.round(NR*storm);rain.visible=nr>0;const wx=storm*7;
  for(let i=0;i<nr;i++){const d=drops[i];d.y-=24*dt;d.x+=wx*dt;if(d.y<0){d.y=18+rnd()*10;d.x=camT.x+rnd()*70-38;d.z=camT.z+rnd()*70-35;}
    const k=i*6;rainPos[k]=d.x;rainPos[k+1]=d.y;rainPos[k+2]=d.z;rainPos[k+3]=d.x-wx*.06;rainPos[k+4]=d.y+.7;rainPos[k+5]=d.z;}
  rainGeo.setDrawRange(0,nr*2);rainGeo.attributes.position.needsUpdate=true;
  // people
  assignJobs();
  for(const p of people){p.anim+=dt;let pose='idle';p.torch=false;
    if(p.role==='leader'){if(!step(p,p.tx,p.tz,3,dt))pose='walk';}
    else if(p.job)pose=doJob(p,dt);
    else if(p.role==='follower'){const bx=-Math.sin(yaw+Math.PI/2)*leader.face,bz=-Math.cos(yaw+Math.PI/2)*leader.face;const tx=leader.x+bx*(1+p.slot*.8)+(p.slot-1)*.5*Math.cos(yaw),tz=leader.z+bz*(1+p.slot*.8)-(p.slot-1)*.5*Math.sin(yaw);
      if(Math.hypot(tx-p.x,tz-p.z)>.35){if(!step(p,tx,tz,3.3,dt))pose='walk';}else p.face=leader.face;}
    else{const k=p.slot;
      if(storm>.5){if(!step(p,camp.x-1.6+k*1.05,camp.z+2.7+(k%2)*.4,3,dt))pose='walk';}
      else if(night>.5){const a=k/4*Math.PI*2+.4,tx=fire.x+Math.cos(a)*1.6,tz=fire.z+Math.sin(a)*1.6;if(!step(p,tx,tz,2,dt))pose='walk';else{pose='sit';p.face=(fire.x-p.x)*Math.cos(yaw)-(fire.z-p.z)*Math.sin(yaw)>0?1:-1;}}
      else if(p.wait>0)p.wait-=dt;else if(step(p,p.tx,p.tz,1.7,dt)){p.wait=1+rnd()*3.5;const n=nearest(camp.x+(rnd()-.5)*14,camp.z+3+(rnd()-.5)*8,4);p.tx=n.x;p.tz=n.z;}else pose='walk';}
    if(storm>.5&&pose==='idle')pose='cover';if(p.role==='leader'&&night>.4&&pose!=='cover')p.torch=true;p.pose=pose;
    const y=hgt(p.x,p.z);p.sp.position.set(p.x,y,p.z);drawSprite(p);
    const px=VIEW/H;p.sp.scale.set(SW*px,SH*px,1);p.blob.position.set(p.x,y+.04,p.z);if(p.ring){p.ring.position.set(p.x,y+.05,p.z);p.ring.material.color.setHSL(.55,1,.6+.1*Math.sin(T*4));}
    // tint sprite by light
    const fd=Math.hypot(p.x-fire.x,p.z-fire.z),fl=night*fire.str*Math.max(0,1-fd/7),amb=(1-night*.72)*(1-storm*.35)+flash*.6+(p.torch?.35*night:0);
    p.sp.material.color.setRGB(Math.min(1,amb+fl),Math.min(1,amb+fl*.62),Math.min(1,amb+fl*.32));}
  if(leader.torch){torchLight.intensity=1.6*night*(1+Math.sin(T*15)*.08);torchLight.position.set(leader.x,hgt(leader.x,leader.z)+2.2,leader.z);}else torchLight.intensity=0;
  if(marker){marker.t-=dt;markerMesh.visible=marker.t>0;markerMesh.position.set(marker.x,hgt(marker.x,marker.z)+.06,marker.z);markerMesh.scale.setScalar(.5+marker.t*2);if(marker.t<=0)marker=null;}
  placeCam();}

// ---------- post: outlines + dithered palette ----------
const rt=new THREE.WebGLRenderTarget(W,H,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});rt.depthTexture=new THREE.DepthTexture(W,H);rt.depthTexture.type=THREE.UnsignedIntType;
const postMat=new THREE.ShaderMaterial({uniforms:{tC:{value:rt.texture},tD:{value:rt.depthTexture},res:{value:new THREE.Vector2(W,H)},range:{value:600},on:{value:1}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`uniform sampler2D tC,tD;uniform vec2 res;uniform float range,on;varying vec2 vUv;
  float D(vec2 o){return texture2D(tD,vUv+o/res).x*range;}
  float b2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
  float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
  void main(){vec4 c=texture2D(tC,vUv);if(on<.5){gl_FragColor=c;return;}
    float d=D(vec2(0.));float behind=max(max(d-D(vec2(1.,0.)),d-D(vec2(-1.,0.))),max(d-D(vec2(0.,1.)),d-D(vec2(0.,-1.))));
    if(behind>.55)c.rgb=c.rgb*.28+vec3(.02,.02,.05);
    else if(D(vec2(0.,1.))-d>.55)c.rgb*=1.2;
    float l=dot(c.rgb,vec3(.299,.587,.114));c.rgb=mix(vec3(l),c.rgb,1.12);
    float L=18.;c.rgb=floor(c.rgb*L+b4(gl_FragCoord.xy))/L;gl_FragColor=c;}`});
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));
function tF(){postMat.uniforms.on.value=1-postMat.uniforms.on.value;document.getElementById('flt').classList.toggle('on',postMat.uniforms.on.value>0);}
document.getElementById('flt').onclick=tF;addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')tF();});
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(postScene,postCam);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
